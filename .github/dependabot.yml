# SPDX-License-Identifier: MPL-2.0
# Dependabot configuration for JuliaPackageSpitter.jl
# Only github-actions applies to this repository; Julia package dependencies
# live in Project.toml and Guix channels in .guix-channel.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

# This workflow is managed by gh actions-lock.
name: Security Audit
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.10'
      
      - name: Install Julia security tools
        run: julia --project=docs -e 'using Pkg; Pkg.add(["JuliaFormatter", "JET", "Aqua"])'
      
      - name: Julia format check
        run: julia --project=docs -e 'using JuliaFormatter; JuliaFormatter.format("."; verbose=true, overwrite=false)'
      
      - name: Julia static analysis
        run: julia --project=docs -e 'using JET; JET.test_package(path=".")'
      
      - name: Julia package audit
        run: julia --project=docs -e 'using Aqua; Aqua.test_all(deps=true)'
      
      - name: Check for outdated dependencies
        run: julia --project=. -e 'using Pkg; Pkg.status(); Pkg.update()'
        continue-on-error: true
      
      - name: Security summary
        run: |
          echo "=== Security Audit Summary ==="
          echo "Completed: $(date)"
          echo "Tools: JuliaFormatter, JET, Aqua"
          echo "Status: See individual job outputs"
          echo "Next audit: Next Monday"

# SPDX-License-Identifier: MPL-2.0
# Weekly Julia security audit.
#
# Every step is a test that can fail:
#   * JuliaFormatter.format returns true only when every file already matches the
#     formatter's style. With overwrite=false it does not throw on a mismatch, so
#     the return value is tested here.
#   * JET reports possible runtime errors in the package.
#   * Aqua.test_all(JuliaPackageSpitter) runs the package-quality checks, including
#     stale and incompatible dependencies. Aqua needs the package itself, so the
#     tooling environment in docs/ develops the package from this checkout.
#
# docs/Project.toml is the tooling environment. Nothing in it is a dependency of
# the package.
name: Security Audit
on:
  schedule:
    - cron: '0 0 * * 1'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1.10'

      - name: Install Julia security tools
        run: julia --project=docs -e 'using Pkg; Pkg.add(["JuliaFormatter", "JET", "Aqua"]); Pkg.develop(PackageSpec(path="."))'

      - name: Julia format check (fails when files are not formatted)
        run: |
          julia --project=docs -e '
            using JuliaFormatter
            ok = try
              format("."; verbose=true, overwrite=false, throw_on_error=true, ignore=[".git", ".git/*"])
            catch err
              msg = replace(sprint(showerror, err), "\n" => "%0A", "\r" => "")
              println("::error title=JuliaFormatter::$(first(msg, 1500))")
              rethrow()
            end
            if !ok
              for (root, _, files) in walkdir(".")
                (root == "./.git" || startswith(root, "./.git/")) && continue
                for f in files
                  endswith(f, ".jl") || continue
                  p = normpath(joinpath(root, f))
                  if !format(p; overwrite=false)
                    orig = read(p, String)
                    tmp = joinpath(dirname(p), ".jf_expected_" * basename(p))
                    fmt = try
                      cp(p, tmp; force=true)
                      format(tmp; overwrite=true)
                      read(tmp, String)
                    finally
                      rm(tmp; force=true)
                    end
                    orig_lines = split(orig, "\n")
                    fmt_lines = split(fmt, "\n")
                    shown = 0
                    for i in 1:max(length(orig_lines), length(fmt_lines))
                      ol = i <= length(orig_lines) ? orig_lines[i] : "<EOF>"
                      fl = i <= length(fmt_lines) ? fmt_lines[i] : "<EOF>"
                      if ol != fl
                        println("::error file=$p,line=$i::JuliaFormatter mismatch: got $(repr(ol)) expected $(repr(fl))")
                        shown += 1
                        shown >= 10 && break
                      end
                    end
                    shown == 0 && println("::error file=$p::File differs in bytes ($(ncodeunits(orig)) vs $(ncodeunits(fmt)))")
                  end
                end
              end
              error("JuliaFormatter: source is not formatted; run format(\".\") locally and commit the result")
            end
          '

      # JET and Aqua run even when the format check fails, so one failing check does
      # not hide the results of the others. The job still fails if any step failed.
      - name: Julia static analysis (JET)
        if: always()
        run: julia --project=docs -e 'using JET, JuliaPackageSpitter; JET.test_package(JuliaPackageSpitter; target_defined_modules=true)'

      - name: Julia package audit (Aqua)
        if: always()
        run: julia --project=docs -e 'using Aqua, JuliaPackageSpitter; Aqua.test_all(JuliaPackageSpitter)'

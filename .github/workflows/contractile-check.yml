# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Contractile Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contractile-check:
    timeout-minutes: 30
    name: Contractile Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      # Install the version pinned in .tool-versions from crates.io. cargo checks
      # every crate against the lockfile checksums, and --locked stops it from
      # resolving newer dependencies. The script is not piped into a shell.
      - name: Install just (pinned to .tool-versions)
        run: |
          cargo install just --version 1.36.0 --locked --root "$HOME/just-bin"
          echo "$HOME/just-bin/bin" >> "$GITHUB_PATH"
          "$HOME/just-bin/bin/just" --version

      - name: Run must checks
        run: just must-check

      - name: Run trust verifications
        run: just trust-verify

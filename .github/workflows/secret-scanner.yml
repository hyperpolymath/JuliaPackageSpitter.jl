# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
# Secret Scanner — calls the bounded scanner in hyperpolymath/cicd-suite.
#
# The suite workflow is a direct caller target: it re-reads `.jobs.scan.uses`
# from this file (via `github.workflow_ref`) and requires job id `scan`,
# repository `hyperpolymath/cicd-suite`, and a full 40-hex SHA pin.
# Context `scan / gitleaks` is preserved for Secret-Scan-Floor.
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    uses: hyperpolymath/cicd-suite/.github/workflows/secret-scanner-reusable.yml@4404c3c0474e17753fe7689f3485c02890aac113
    with:
      fast-pr: false
